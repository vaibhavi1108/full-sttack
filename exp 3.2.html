<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .delete-btn {
            background: red;
        }

        .delete-btn:hover {
            background: darkred;
        }
    </style>
</head>

<body>

<h1>📚 Library Management System</h1>

<div class="container">

    <h3>Add Book</h3>
    <input type="text" id="bookId" placeholder="Book ID">
    <input type="text" id="bookTitle" placeholder="Book Title">
    <input type="text" id="bookAuthor" placeholder="Author Name">
    <button onclick="addBook()">Add Book</button>

    <h3>Search Book</h3>
    <input type="text" id="searchInput" placeholder="Search by title" onkeyup="searchBook()">

    <table>
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="bookList"></tbody>
    </table>

</div>

<script>
    let books = [];

    function addBook() {
        const id = document.getElementById("bookId").value;
        const title = document.getElementById("bookTitle").value;
        const author = document.getElementById("bookAuthor").value;

        if (id === "" || title === "" || author === "") {
            alert("Please fill all fields");
            return;
        }

        books.push({ id, title, author });
        displayBooks();
        clearInputs();
    }

    function displayBooks(filteredBooks = books) {
        const table = document.getElementById("bookList");
        table.innerHTML = "";

        filteredBooks.forEach((book, index) => {
            table.innerHTML += `
                <tr>
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>
                        <button class="delete-btn" onclick="removeBook(${index})">
                            Remove
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    function removeBook(index) {
        books.splice(index, 1);
        displayBooks();
    }

    function searchBook() {
        const searchValue = document.getElementById("searchInput").value.toLowerCase();
        const filteredBooks = books.filter(book =>
            book.title.toLowerCase().includes(searchValue)
        );
        displayBooks(filteredBooks);
    }

    function clearInputs() {
        document.getElementById("bookId").value = "";
        document.getElementById("bookTitle").value = "";
        document.getElementById("bookAuthor").value = "";
    }
</script>

</body>
</html>
