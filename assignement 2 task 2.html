<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background-color: #333;
            color: white;
        }

        .even {
            background-color: #e6f2ff;
        }

        .odd {
            background-color: #ffffff;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <h2>Dynamic Table Row Creation</h2>

    <!-- Input Fields -->
    <input type="text" id="name" placeholder="Enter Name">
    <input type="number" id="age" placeholder="Enter Age">
    <input type="text" id="course" placeholder="Enter Course">
    <br>
    <button onclick="addRow()">Add Row</button>

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <!-- JavaScript -->
    <script>
        function addRow() {
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let course = document.getElementById("course").value;

            if (name === "" || age === "" || course === "") {
                alert("Please fill all fields");
                return;
            }

            let tableBody = document.getElementById("tableBody");
            let row = tableBody.insertRow();

            row.insertCell(0).innerHTML = name;
            row.insertCell(1).innerHTML = age;
            row.insertCell(2).innerHTML = course;

            let deleteCell = row.insertCell(3);
            deleteCell.innerHTML = "<button class='delete-btn' onclick='deleteRow(this)'>Delete</button>";

            updateRowColors();

            // Clear input fields
            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
            document.getElementById("course").value = "";
        }

        function deleteRow(button) {
            let row = button.parentElement.parentElement;
            row.remove();
            updateRowColors();
        }

        function updateRowColors() {
            let rows = document.getElementById("tableBody").rows;

            for (let i = 0; i < rows.length; i++) {
                rows[i].className = (i % 2 === 0) ? "even" : "odd";
            }
        }
    </script>

</body>
</html>
